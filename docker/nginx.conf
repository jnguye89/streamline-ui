server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Relative Location headers, so redirects keep https behind Cloudflare.
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

  # One URL per page: /guides/foo/ -> /guides/foo
  rewrite ^/(.+)/$ /$1 permanent;

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Hashed build output never changes, so it can be cached for a year.
  location ~* "-[A-Z0-9]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell must always be fresh so new deploys show up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  # Angular app routes: anything else would be a soft 404 (HTTP 200 with an
  # empty app), so only these paths fall back to the app.
  location ~ ^/(watch|profile|yap|podcast|stream|listen|read|call|login)(/.*)?$ {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # Real files (assets, robots.txt, sitemap.xml) and the static SEO pages
  # (/features, /guides/...). Unknown URLs get a real 404.
  location / {
    try_files $uri $uri/index.html =404;
  }
}
