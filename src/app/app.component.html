<div class="buttons header-container" data-gamepad-row="top" fxLayout="row" fxLayoutAlign="space-between center" style="width: 100%">
  <div class="side side--left">
    <button gamepadFocusable class="icon-wrapper icon-btn profile-btn" (click)="handleProfileClick()"
      [attr.aria-label]="(me$ | async) ? 'Your profile' : 'Sign in'">
      <ng-container *ngIf="me$ | async as me; else signedOut">
        <app-user-avatar [userId]="me.id" [name]="me.name" [picture]="me.picture"></app-user-avatar>
      </ng-container>
      <ng-template #signedOut><mat-icon class="transparent icon">person</mat-icon></ng-template>
    </button>
    <button gamepadFocusable *ngIf="showLogout && (me$ | async)" type="button" class="logout-btn" (click)="logout()">
      <span class="logout-btn__icon" aria-hidden="true"></span>Log out
    </button>
  </div>
  <div>
    <a gamepadFocusable mat-button class="transparent button large-button" routerLink="/podcast">
      podcast
    </a>
    <!-- <button mat-button button class="transparent button large-button" [routerLink]="['/call']">
      call
    </button> -->
    <a gamepadFocusable mat-button class="transparent button large-button" routerLink="/stream">
      live
    </a>
    <a gamepadFocusable mat-button class="transparent button large-button" routerLink="/watch">
      watch
    </a>
    <!-- <button
      mat-button
      button
      class="transparent button large-button"
      [routerLink]="['/live']"
    >
      live
    </button> -->
    <a gamepadFocusable mat-button class="transparent button large-button" routerLink="/yap">
      yap
    </a>
    <!-- <button mat-button button class="transparent button large-button" [routerLink]="['/listen']">
      listen
    </button>
    <button mat-button button class="transparent button large-button" [routerLink]="['/read']">
      read
    </button> -->
  </div>
  <div class="side side--right">
    <app-get-tv></app-get-tv>
    <button gamepadFocusable class="icon-wrapper icon-btn" (click)="openSearch()" aria-label="Search">
      <mat-icon class="transparent icon">search</mat-icon>
    </button>
  </div>
</div>
<div id="rotate-overlay">📱🔄<br />Please rotate your device</div>
<router-outlet></router-outlet>
