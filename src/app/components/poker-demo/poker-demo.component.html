<div class="poker-demo">
  <!-- Same honest corner badge as the other game previews. -->
  <div class="demo-badge">
    <span class="dot"></span>
    Auto-play preview
  </div>

  <div #stageArea class="stage-area" aria-hidden="true">
    @if (view(); as v) {
      <div class="stage" [style.transform]="'translate(-50%, -50%) scale(' + scale() + ')'">
        <pk-table-screen [view]="v" [flags]="flags" [now]="0"></pk-table-screen>
      </div>
    }
  </div>

  <div class="demo-overlay">
    <div class="demo-copy">
      <div class="demo-title">All in?</div>
      <div class="demo-subtitle">Play poker now! no setup, no download.</div>
    </div>
    <button gamepadFocusable class="demo-cta" (click)="onJoinClick()">
      Press to play
    </button>
  </div>
</div>
