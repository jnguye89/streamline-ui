<div class="chess-game">
  <div class="chess-meta">
    <div class="players">
      <span class="player white" [class.turn]="state?.turn === 'white' && state?.status === 'active'">
        ♔ {{ state?.whiteUser?.username ?? '…' }}
      </span>
      <span class="vs">vs</span>
      <span class="player black" [class.turn]="state?.turn === 'black' && state?.status === 'active'">
        ♚ {{ state?.blackUser?.username ?? 'open seat' }}
      </span>
    </div>

    <div class="status" *ngIf="statusMessage as msg">{{ msg }}</div>
    <div class="check-flag" *ngIf="isCheck">Check!</div>

    <div class="draw-banner" *ngIf="incomingDrawOffer">
      Your opponent offers a draw
    </div>

    <div class="chess-actions">
      <button gamepadFocusable *ngIf="!isLoggedIn && canJoin" class="chess-cta" (click)="goToLogin()">
        Log in to play
      </button>
      <button gamepadFocusable *ngIf="isLoggedIn && canJoin" class="chess-cta" (click)="join()">
        Join as Black
      </button>

      <ng-container *ngIf="mySeat && state?.status === 'active'">
        <ng-container *ngIf="incomingDrawOffer; else offerOrPending">
          <button gamepadFocusable class="chess-cta accept" (click)="acceptDraw()">
            Accept Draw
          </button>
          <button gamepadFocusable class="chess-cta decline" (click)="declineDraw()">
            Decline
          </button>
        </ng-container>
        <ng-template #offerOrPending>
          <button gamepadFocusable *ngIf="canOfferDraw" class="chess-cta" (click)="offerDraw()">
            Offer Draw
          </button>
          <span class="chess-cta pending" *ngIf="myDrawOfferPending">
            Draw offer sent…
          </span>
        </ng-template>

        <button gamepadFocusable class="chess-cta resign" (click)="resign()">
          Resign
        </button>
      </ng-container>
    </div>
  </div>

  <!-- Board flanked by both trays of captured pieces instead of stacking
       them above the board in .chess-meta - the board is height-capped and
       square (see chess-board.component.scss), which on any landscape
       screen leaves wide empty gutters either side of it that this now
       fills. Left = pieces white has taken (black pieces), right = pieces
       black has taken (white pieces) - matching the left-white/right-black
       order the player names above are already shown in, so the mapping
       reads the same way regardless of which color a spectator is used to
       playing. Both trays render unconditionally (not *ngIf) and reserve
       equal fixed width so the board stays centered between them even when
       one side has captured nothing yet. -->
  <div class="board-row">
    <div class="side-tray left">
      <div class="tray-pieces">
        <app-chess-piece-icon *ngFor="let p of capturedByWhite" [type]="p" color="b" size="tray">
        </app-chess-piece-icon>
      </div>
      <span class="material-edge" *ngIf="materialDiff > 0">+{{ materialDiff }}</span>
    </div>

    <app-chess-board class="board" [fen]="state?.fen ?? ''" [orientation]="orientation" [interactive]="isMyTurn"
      (move)="onMoveAttempt($event)">
    </app-chess-board>

    <div class="side-tray right">
      <div class="tray-pieces">
        <app-chess-piece-icon *ngFor="let p of capturedByBlack" [type]="p" color="w" size="tray">
        </app-chess-piece-icon>
      </div>
      <span class="material-edge" *ngIf="materialDiff < 0">+{{ -materialDiff }}</span>
    </div>
  </div>

  <div class="chess-error" *ngIf="errorMessage" aria-live="polite">{{ errorMessage }}</div>
</div>
