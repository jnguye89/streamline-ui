<div class="watch-container" [class.portrait]="isPortrait" [class.overlay-hidden]="overlayHidden">
  <!-- <video #player id="watch-player" controls autoplay playsinline loop (loadedmetadata)="onVideoLoaded(player)">
  </video> -->
  <!-- VOD player -->
  <video #player id="watch-player" [class.is-hidden]="currentItem?.type === 'live' || isYouTube(currentItem)"
    (loadedmetadata)="onVideoLoaded(player)" (ended)="next()" (play)="onVideoPlay()" (pause)="onVideoPause()"
    playsinline controls>
  </video>

  <!-- YouTube exposes no raw playable file, only its iframe embed player.
       Autoplay requires starting muted (see youtubeEmbedSrc); (load) is
       what hands control to the IFrame Player API to unmute it right after,
       the same way (loadedmetadata) does for the native <video> above. -->
  <iframe *ngIf="isYouTube(currentItem)" id="watch-youtube-player" [src]="youtubeEmbedSrc | safeUrl"
    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen (load)="onYoutubeIframeLoad()">
  </iframe>

  <div #agoraContainer class="agora-container" [class.is-hidden]="currentItem?.type !== 'live'">
  </div>

  <!-- Chess: no video/Agora surface, so it's only mounted (not just hidden)
       while a chess item is actually current - see WatchComponent.tryPlayCurrent -->
  <app-chess-game *ngIf="currentItem?.type === 'chess'" [game]="$any(currentItem)"></app-chess-game>

  <!-- Demo placeholder: swapped in by WatchComponent whenever there are no
       real chess games to show (see CHESS_DEMO_ITEM) - an auto-playing,
       non-interactive board with a big "start a game" call to action. -->
  <app-chess-demo *ngIf="currentItem?.type === 'chess-demo'" (join)="startChessGame()"></app-chess-demo>

  <!-- Off-screen pool that buffers the next few VODs ahead of time -->
  <div #preloadContainer class="preload-container"></div>

  <!-- D-pad/arrow up-down volume feedback (VOD only - see
       WatchComponent.adjustVolume). Kept as a sibling of .overlay, not
       nested inside it, so it can appear/fade on its own timer regardless
       of the overlay's separate auto-hide state. -->
  <div class="volume-indicator" *ngIf="showVolumeIndicator">
    <mat-icon>{{ volumeLevel === 0 ? 'volume_off' : volumeLevel < 50 ? 'volume_down' : 'volume_up' }}</mat-icon>
    <div class="volume-track"><div class="volume-fill" [style.width.%]="volumeLevel"></div></div>
    <span class="volume-value">{{ volumeLevel }}</span>
  </div>

  <!-- Overlay (fills the container) -->
  <div class="overlay" [class.hidden]="overlayHidden">
    <!-- Top-left title + LIVE chip -->
    <div class="topbar">
      <mat-chip-set>
        <mat-chip *ngIf="currentItem?.type === 'live'" color="warn" selected>LIVE</mat-chip>
        <mat-chip *ngIf="currentItem?.type === 'vod' && $any(currentItem).isProcessed" class="processed-chip" selected>
          <mat-icon matChipAvatar>auto_awesome</mat-icon>
          Processed
        </mat-chip>
      </mat-chip-set>
      <!-- <div class="title">{{ currentItem?.title }}</div> -->
    </div>

    <!-- Side nav buttons -->
    <button gamepadFocusable class="nav prev" mat-icon-button (click)="previous()" [disabled]="!hasMany" aria-label="Previous">
      <mat-icon>skip_previous</mat-icon>
    </button>

    <button #nextBtn gamepadFocusable class="nav next" mat-icon-button (click)="next()" [disabled]="!hasMany" aria-label="Next">
      <mat-icon>skip_next</mat-icon>
    </button>

    <!-- Live chat: floating messages + send box, viewers only see this while watching a live stream -->
    <ng-container *ngIf="currentItem?.type === 'live'">
      <div class="chat-overlay" aria-live="polite">
        <div class="chat-message" *ngFor="let m of chatMessages; trackBy: trackChatMessage">
          <span class="chat-username" [style.color]="m.userId | chatColor">{{ m.username }}</span>
          <span class="chat-text">{{ m.text }}</span>
        </div>
      </div>

      <form class="chat-input-row" (ngSubmit)="sendChat()">
        <input class="chat-input" type="text" [(ngModel)]="chatText" name="chatText" placeholder="Say something..."
          maxlength="500" autocomplete="off" />
        <button gamepadFocusable type="submit" class="chat-send" [disabled]="!chatText.trim()" aria-label="Send chat message">
          <mat-icon>send</mat-icon>
        </button>
      </form>
    </ng-container>

    <!-- Bottom action row: view count, profile/down, like count -->
    <div class="bottom-actions">
      <div *ngIf="currentItem?.type === 'vod' && !isYouTube(currentItem)" class="action view" aria-label="View count">
        <span class="count">{{ $any(currentItem).viewCount ?? 0 | number }}</span>
        <mat-icon>visibility</mat-icon>
      </div>

      <button gamepadFocusable class="profile" (click)="goToProfile()" aria-label="Profile">
        <mat-icon>arrow_downward</mat-icon>
      </button>

      <button *ngIf="currentItem?.type === 'vod' && !isYouTube(currentItem)" gamepadFocusable class="action like" [class.liked]="$any(currentItem).liked"
        [disabled]="$any(currentItem).liked" (click)="onLike()" [attr.aria-label]="$any(currentItem).liked ? 'Already liked' : 'Like'">
        <mat-icon>{{ $any(currentItem).liked ? 'favorite' : 'favorite_border' }}</mat-icon>
        <span class="count">{{ $any(currentItem).likeCount ?? 0 | number }}</span>
      </button>

      <!-- Only on the chess page itself (a real game or the no-games-yet
           demo placeholder), not on regular videos/live - and not even
           there if you're already seated in the game currently on screen
           (see canPlayChess). -->
      <button *ngIf="canPlayChess" gamepadFocusable class="action play-chess" (click)="startChessGame()"
        aria-label="Play Chess">
        <mat-icon>sports_esports</mat-icon>
        <span class="count">Play Chess</span>
      </button>
    </div>

  </div>
</div>
