<div #previewStage class="preview-stage">
  <video
    #video
    class="primary-preview"
    autoplay
    playsinline
    muted
    id="local-player"
    aria-label="Selected stream input preview"
  ></video>
  <button
    gamepadFocusable
    class="fullscreen-action"
    type="button"
    aria-label="Toggle preview fullscreen"
    (click)="toggleFullscreen()"
  >
    <mat-icon>fullscreen</mat-icon>
  </button>
</div>

<ng-container *ngIf="mediaState$ | async as media">
  <div
    class="screen-overlay"
    *ngIf="media.status === 'loading' || media.permission === 'requesting'"
    aria-live="polite"
    role="status"
  >
    <div class="overlay-card">
      <mat-progress-spinner mode="indeterminate" diameter="48"></mat-progress-spinner>
      <h2>Setting up your inputs…</h2>
      <p>Allow camera and microphone access when Chrome asks.</p>
    </div>
  </div>

  <div
    class="status-banner"
    *ngIf="
      isAuthenticated &&
      (media.error || workflowError || previewState.error)
    "
    role="alert"
  >
    <p class="status-message error" *ngIf="media.error">
      {{ media.error.message }}
    </p>
    <p class="status-message error" *ngIf="workflowError">
      {{ workflowError }}
    </p>
    <p class="status-message error" *ngIf="previewState.error as previewError">
      {{ previewError.message }}
    </p>
    <button
      gamepadFocusable
      mat-flat-button
      type="button"
      *ngIf="workflowError && !isReady"
      [disabled]="isInitializing"
      (click)="retrySetup()"
    >
      Retry setup
    </button>
    <button
      gamepadFocusable
      mat-flat-button
      type="button"
      *ngIf="
        media.status === 'error' ||
        media.status === 'unavailable' ||
        previewState.status === 'error'
      "
      (click)="retryInputs()"
    >
      Retry inputs
    </button>
  </div>
</ng-container>

<ng-container *ngIf="isReady">
  <div class="chat-overlay" aria-live="polite">
    <div
      class="chat-message"
      *ngFor="let message of chatMessages; trackBy: trackChatMessage"
    >
      <span
        class="chat-username"
        [style.color]="message.userId | chatColor"
      >
        {{ message.username }}
      </span>
      <span class="chat-text">{{ message.text }}</span>
    </div>
  </div>

  <form class="chat-input-row" (ngSubmit)="sendChat()">
    <input
      class="chat-input"
      type="text"
      [(ngModel)]="chatText"
      name="chatText"
      placeholder="Say something..."
      maxlength="500"
      autocomplete="off"
    />
    <button
      gamepadFocusable
      type="submit"
      class="chat-send"
      [disabled]="!chatText.trim()"
      aria-label="Send chat message"
    >
      <mat-icon>send</mat-icon>
    </button>
  </form>
</ng-container>

<div class="stream-toolbar">
  <ng-container *ngIf="isAuthenticated; else loginControl">
    <button
      gamepadFocusable
      class="stream-toolbar__button stream-toolbar__button--live"
      [class.stream-toolbar__button--live-on]="isLive"
      type="button"
      [attr.aria-label]="isLive ? 'Stop streaming' : 'Go live'"
      (click)="isLive ? stopWebcam() : resumeWebcam()"
      [disabled]="
        isStarting ||
        (!isLive &&
          (!isReady ||
            previewState.status === 'error' ||
            !mediaInput.snapshot.selection.videoDeviceId))
      "
    >
      {{ isLive ? 'End stream' : 'Go live' }}
    </button>

    <div class="stream-toolbar__separator"></div>

    <div class="mode-group" role="group" aria-label="Video source">
      <button
        gamepadFocusable
        class="mode-btn"
        type="button"
        [class.mode-btn--active]="displayMode === 'webcam'"
        [disabled]="!webcamDeviceId || isApplyingInputs || isStarting"
        aria-label="Show webcam only"
        (click)="selectWebcamMode()"
      >
        <mat-icon>videocam</mat-icon>
        <span class="mode-btn__label">Webcam</span>
      </button>
      <button
        gamepadFocusable
        class="mode-btn"
        type="button"
        [class.mode-btn--active]="displayMode === 'screen'"
        [disabled]="!screenDeviceId || isApplyingInputs || isStarting"
        aria-label="Show screen only"
        (click)="selectScreenMode()"
      >
        <mat-icon>desktop_windows</mat-icon>
        <span class="mode-btn__label">Screen</span>
      </button>
      <button
        gamepadFocusable
        class="mode-btn mode-btn--primary"
        type="button"
        [class.mode-btn--active]="displayMode === 'screen-cam'"
        [disabled]="!webcamDeviceId || !screenDeviceId || isApplyingInputs || isStarting"
        aria-label="Show screen and webcam"
        (click)="selectScreenCamMode()"
      >
        <mat-icon>picture_in_picture</mat-icon>
        <span class="mode-btn__label">Screen + cam</span>
      </button>
    </div>

    <div class="mode-swap" *ngIf="displayMode === 'screen-cam'">
      <span
        class="mode-avatar mode-avatar--webcam"
        [class.mode-avatar--active]="isWebcamPrimary"
        aria-hidden="true"
      >W</span>
      <button
        gamepadFocusable
        class="mode-swap-btn"
        type="button"
        aria-label="Swap main display and facecam (or press Y)"
        [disabled]="isApplyingInputs || isStarting"
        (click)="swapSources()"
      >
        <mat-icon>swap_horiz</mat-icon>
        <span class="mode-swap-btn__hint">Y</span>
      </button>
      <span
        class="mode-avatar mode-avatar--screen"
        [class.mode-avatar--active]="!isWebcamPrimary"
        aria-hidden="true"
      >S</span>
    </div>

    <div class="stream-toolbar__separator"></div>

    <ng-container *ngIf="audioMix$ | async as mix">
      <div class="audio-group">
        <span class="audio-group__label">Mic</span>
        <button
          gamepadFocusable
          class="audio-toggle"
          type="button"
          [class.audio-toggle--muted]="mix.microphoneMuted"
          [attr.aria-pressed]="!mix.microphoneMuted"
          [attr.aria-label]="
            (mix.microphoneMuted ? 'Unmute microphone' : 'Mute microphone') +
            ' (or press LB)'
          "
          (click)="toggleMicrophoneMute()"
        >
          <mat-icon>{{ mix.microphoneMuted ? 'mic_off' : 'mic' }}</mat-icon>
          LB
        </button>
      </div>

      <div class="audio-group">
        <span class="audio-group__label">Screen Audio</span>
        <button
          gamepadFocusable
          class="audio-toggle"
          type="button"
          [class.audio-toggle--muted]="mix.gameMuted"
          [attr.aria-pressed]="!mix.gameMuted"
          [attr.aria-label]="
            (mix.gameMuted ? 'Unmute screen audio' : 'Mute screen audio') +
            ' (or press RB)'
          "
          (click)="toggleGameMute()"
        >
          <mat-icon>{{ mix.gameMuted ? 'volume_off' : 'volume_up' }}</mat-icon>
          RB
        </button>
      </div>
    </ng-container>
  </ng-container>

  <ng-template #loginControl>
    <button
      gamepadFocusable
      class="stream-toolbar__button"
      type="button"
      (click)="login()"
    >
      Login to start streaming
    </button>
  </ng-template>
</div>
