<video #video autoplay playsinline muted id="local-player"></video>
<!-- Setup overlay: visible until isReady === true -->
<div class="screen-overlay" *ngIf="!isReady" aria-live="polite" role="status">
  <div class="overlay-card">
    <mat-progress-spinner mode="indeterminate" diameter="48"></mat-progress-spinner>
    <h2>We’re setting up your stream…</h2>
    <p>This can take a few seconds.</p>
  </div>
</div>
<!-- Bottom toolbar - same look as the podcast page's rec/go-live panel -->
<div class="toolbar">
  <ng-container *ngIf="isAuthenticated$ | async; else loginPrompt">
    <span class="toolbar__status" [class.toolbar__status--live]="isLive$ | async" aria-live="polite">
      <i class="toolbar__dot"></i>
      LIVE
    </span>

    <div class="toolbar__sep"></div>

    <button gamepadFocusable class="toolbar__btn toolbar__btn--rec" disabled title="Record">
      <i class="toolbar__dot toolbar__dot--red"></i>
      REC
    </button>

    <div class="toolbar__sep"></div>

    <button gamepadFocusable class="toolbar__btn toolbar__btn--live"
            [class.toolbar__btn--live-on]="isLive$ | async"
            [disabled]="!isReady"
            (click)="toggleLive()"
            title="Go live">
      <mat-icon class="toolbar__live-icon">fiber_manual_record</mat-icon>
      GO LIVE
    </button>

    <div class="toolbar__sep"></div>

    <button gamepadFocusable class="toolbar__btn toolbar__btn--ai" [class.toolbar__btn--ai-on]="aiMagicEnabled"
            [attr.aria-pressed]="aiMagicEnabled" (click)="toggleAiMagic()" title="AI Magic">
      ✦ AI Magic
    </button>
  </ng-container>

  <ng-template #loginPrompt>
    <button gamepadFocusable mat-flat-button (click)="login()">Login to start streaming</button>
  </ng-template>
</div>

<!-- Live chat: floating messages from viewers, oldest falls off as new ones arrive -->
<ng-container *ngIf="isReady">
  <div class="chat-overlay" aria-live="polite">
    <div class="chat-message" *ngFor="let m of chatMessages; trackBy: trackChatMessage">
      <span class="chat-username" [style.color]="m.userId | chatColor">{{ m.username }}</span>
      <span class="chat-text">{{ m.text }}</span>
    </div>
  </div>

  <form class="chat-input-row" (ngSubmit)="sendChat()">
    <input class="chat-input" type="text" [(ngModel)]="chatText" name="chatText" placeholder="Say something..."
      maxlength="500" autocomplete="off" />
    <button gamepadFocusable type="submit" class="chat-send" [disabled]="!chatText.trim()" aria-label="Send chat message">
      <mat-icon>send</mat-icon>
    </button>
  </form>
</ng-container>
