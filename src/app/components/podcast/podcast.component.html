<div class="podcast-view">

  <!-- ── Local camera preview (always visible) ── -->
  <video #localPreview class="local-preview" autoplay playsinline muted></video>

  <!-- ── Remote stage (active call) ── -->
  <section class="stage" *ngIf="isConnected">
    <div id="stage">
      <div id="remote-container" class="stage__grid">
        <!-- remote tiles injected by RtcService -->
      </div>
    </div>
  </section>

  <!-- ── User-picker panel (slides up above toolbar) ── -->
  <div class="user-picker" *ngIf="showUserPicker">
    <div class="user-picker__header">
      <span class="user-picker__title">People</span>
      <button gamepadFocusable class="user-picker__close" (click)="closeUserPicker()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <button gamepadFocusable
            type="button"
            class="user-picker__search"
            (click)="openPeopleSearch()">
      <span class="user-picker__search-text" [class.placeholder]="!searchControl.value">{{ searchControl.value || 'Search users…' }}</span>
    </button>

    <div class="user-picker__list">
      <label gamepadFocusable class="user"
             *ngFor="let u of (filteredUsers$ | async)"
             [class.self]="u.auth0UserId == (user$ | async)?.sub">
        <input type="checkbox"
               [(ngModel)]="selected[u.agoraUserId]"
               [disabled]="u.auth0UserId == (user$ | async)?.sub || (!canSelect(u.agoraUserId) && !selected[u.agoraUserId])" />
        <span class="user__avatar">{{ u.username[0] || 'U' }}</span>
        <span class="user__name">{{ u.username }}</span>
        <span class="user__presence" [class.online]="online(u.agoraUserId)"></span>
      </label>
    </div>

    <div class="user-picker__footer">
      <!-- <mat-slide-toggle gamepadFocusable [(ngModel)]="isVideo" [disabled]="isPodcast">Video</mat-slide-toggle> -->
      <button gamepadFocusable mat-flat-button color="primary"
              [disabled]="selectedCount === 0"
              (click)="callSelected(); closeUserPicker()">
        Call {{ selectedCount > 0 ? '(' + selectedCount + ')' : '' }}
      </button>
    </div>
  </div>

  <!-- ── TV camera chrome (handoff 21_podcast_setup) ── -->
  <div class="cam-scrim"></div>

  <span class="cam-chip cam-chip--left">
    <span class="cam-ic" [style.--ic]="icon('mic')"></span>Podcast
  </span>
  <span class="cam-chip cam-chip--right">
    <span class="cam-ic" [style.--ic]="icon('lock')"></span>Private by default
  </span>

  <div class="cam-dock">
    <div class="cam-box" *ngIf="!isRecording && !showUserPicker">
      <div class="cam-note cam-note--plain">
        <span class="cam-ic" [style.--ic]="icon('lock')"></span>
        <span><b>Private by default.</b> Records you. You can invite people once you are recording.
          Saved to your profile as Private; you choose who can watch after.</span>
      </div>
    </div>

    <div class="cam-bar">
      <!-- The podcast camera is the webcam only; Screen needs the Live page's inputs. -->
      <div class="cam-group">
        <span class="cam-seg cam-seg--on">Webcam</span>
      </div>

      <span class="cam-sep"></span>

      <div class="cam-group cam-audio" [class.cam-audio--muted]="micMuted">
        <span class="cam-ic" [style.--ic]="icon('mic')"></span>Mic
        <button gamepadFocusable class="cam-kbd" type="button"
          [attr.aria-pressed]="!micMuted"
          [attr.aria-label]="(micMuted ? 'Unmute microphone' : 'Mute microphone') + ' (or press LB)'"
          (click)="toggleMic()">LB</button>
      </div>

      <span class="cam-sep"></span>

      <span class="cam-private cam-private--on">
        <span class="cam-ic" [style.--ic]="icon('lock')"></span>Private<span class="cam-onoff">On</span>
      </span>

      <!-- Simulcast is for lives, so the circles are greyed out here. -->
      <span class="cam-circle cam-circle--dim" aria-hidden="true">s</span>
      <span class="cam-circle cam-circle--dim" aria-hidden="true">T</span>
      <span class="cam-circle cam-circle--dim" aria-hidden="true">K</span>
      <span class="cam-circle cam-circle--dim" aria-hidden="true">Y</span>
    </div>

    <div class="cam-actions">
      <!-- Not recording: Go live takes you to the Live page.
           Recording: it also streams the recording live (as before). -->
      <button gamepadFocusable type="button" class="cam-action cam-action--live"
        (click)="isRecording ? toggleLive() : goTo('/stream')">
        <span class="cam-ic" [style.--ic]="icon('go_live')"></span>
        <span class="cam-action__text">
          <span class="cam-action__title">{{ isLive ? 'End live' : 'Go live' }}</span>
          <span class="cam-action__sub">{{ isLive ? 'Recording stays on' : 'Public by default' }}</span>
        </span>
      </button>

      <button gamepadFocusable type="button" class="cam-action cam-action--here"
        (click)="isRecording ? stopRecording() : startRecording()">
        <span class="cam-ic" [style.--ic]="icon('mic')"></span>
        <span class="cam-action__text">
          <span class="cam-action__title">{{ isRecording ? 'Stop recording' : 'Podcast' }}</span>
          <span class="cam-action__sub">{{ isRecording ? 'Recording…' : 'Record · private by default' }}</span>
        </span>
      </button>

      <button gamepadFocusable type="button" class="cam-action" (click)="toggleUserPicker()">
        <span class="cam-ic" [style.--ic]="icon('call')"></span>
        <span class="cam-action__text">
          <span class="cam-action__title">Call</span>
          <span class="cam-action__sub">Private · not saved</span>
        </span>
      </button>
    </div>
  </div>

  <div class="cam-keyline">
    <span class="cam-key"><span class="cam-cap">◀</span><span class="cam-cap">▲</span><span class="cam-cap">▼</span><span class="cam-cap">▶</span>Move</span>
    <span class="cam-key"><span class="cam-cap">A</span>Choose</span>
    <span class="cam-key"><span class="cam-cap cam-cap--sq">LB</span>Mic</span>
    <span class="cam-key"><span class="cam-cap">B</span>Back to your profile</span>
  </div>

</div>
